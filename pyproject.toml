[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satoshi-kit"
version = "3.0.0"
description = "Bitcoin key management toolkit — BIP32/39 HD wallets, address generation, and wallet.dat read/write"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "cryptography>=41.0",
    "ecdsa>=0.18",
    "pycryptodome>=3.15",
]

[project.optional-dependencies]
wallet = ["bsddb3"]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
satoshi-kit = "satoshi_kit.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/satoshi_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
